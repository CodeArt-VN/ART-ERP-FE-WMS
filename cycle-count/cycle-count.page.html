<ion-header [translucent]="true">
	<app-toolbar [page]="this"></app-toolbar>
</ion-header>

<ion-content [fullscreen]="true" appScrollbarTheme class="left scrollx" forceOverscroll="false">
	<app-page-title class="ion-padding safe-max-width" [pageConfig]="pageConfig"></app-page-title>

	<div class="safe-max-width">
		<app-data-table
			class="box-shadow responsive"
			[rows]="items"
			[trackBy]="'Id'"
			[(selectedRows)]="selectedItems"
			[showSpinner]="pageConfig.showSpinner"
			[showFilter]="pageConfig.isShowSearch"
			[(query)]="query"
			(dataInfinite)="loadData($event)"
			(filter)="onDatatableFilter($event)"
			(sort)="onSort($event)"
			(selectedRowsChange)="showCommandBySelectedRows($event)"
		>
			<datatable-column [checkbox]="true" name=""></datatable-column>
			<datatable-column class="col-id" name="#" property="Id" [navLink]="pageConfig.pageName"></datatable-column>
			<datatable-column class="col-name" name="Warehouse" property="WarehouseName" [navLink]="pageConfig.pageName">
				<ng-template datatable-filter-template>
					<input [ngModelOptions]="{standalone: true}" [(ngModel)]="query.BranchName" class="c-input" [ngClass]="{active: query.BranchName}" type="text" />
					<ion-icon class="min-btn" (click)="query.BranchName=''; refresh()" *ngIf="query.BranchName" name="close-circle-outline"></ion-icon>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-name" format="dd/MM/yyyy HH:mm" name="Count date" property="CountDate" filterControlType="date" [navLink]="pageConfig.pageName"></datatable-column>
			<datatable-column class="col-status" name="Status" property="Status" [navLink]="pageConfig.pageName"></datatable-column>
		</app-data-table>
	</div>

	<div class="ion-padding"></div>
</ion-content>
