<ion-header [translucent]="true">
	<app-toolbar [page]="this"></app-toolbar>
</ion-header>

<ion-content [fullscreen]="true" appScrollbarTheme class="ion-padding">
	<div id="item-group-detail-page" style="position: absolute; z-index: 30005"></div>

	<div class="main-view" *ngIf="item && pageConfig.showSpinner == false">
		<ion-grid fixed>
			<form [formGroup]="formGroup">
				<ion-row class="hr-group">
					<ion-col size="12" size-sm="12" size-md="12" size-xl="3">
						<ion-list-header class="ion-no-padding">
							<ion-label color="primary">{{ 'Product group' | translate }}</ion-label>
						</ion-list-header>
					</ion-col>
					<ion-col size="12" size-sm size-xl="4">
						<app-form-control [field]="{ id: 'Code', label: 'Code', type: 'text', form: formGroup }" (change)="saveChange()">
							<small label *ngIf="item?.Id">Id: {{ item.Id }}</small>
						</app-form-control>
						<app-form-control [field]="{ id: 'Name', label: 'Name', type: 'text', form: formGroup }" (change)="saveChange()"></app-form-control>
					</ion-col>
					<ion-col size="12" size-sm size-xl="4">
						<app-form-control
							[field]="{
								id: 'IDParent',
								label: 'Belonged to group',
								type: 'ng-select',
								form: formGroup,
								dataSource: itemGroupList,
								bindLabel: 'Name',
								bindValue: 'Id',
								clearable: true,
								appendTo: '#item-group-detail-page',
								treeConfig: { searchFnDefault: true, isTree: true, isCollapsed: true }
							}"
							(change)="saveChange()"
						></app-form-control>
						<app-form-control [field]="{ id: 'Sort', label: 'Sort', type: 'number', form: formGroup }" (change)="saveChange()"></app-form-control>
					</ion-col>
				</ion-row>
			</form>
		</ion-grid>

		<div class="row-full shadow full-screen">
			<ion-toolbar color="primary">
				<ion-segment scrollable="true" (ionChange)="segmentChanged($event)" [value]="segmentView">
					<ion-segment-button value="s1">
						<ion-label>{{ 'Accounts by company' | translate }}</ion-label>
					</ion-segment-button>
					<ion-segment-button value="s2">
						<ion-label>{{ 'Other information' | translate }}</ion-label>
					</ion-segment-button>
				</ion-segment>
			</ion-toolbar>

			<div class="ion-padding" *ngIf="segmentView == 's1'">
				<div *ngIf="!id || id == '0'">
					<app-page-message
						[itemsLength]="0"
						[showSpinner]="false"
						[showImg]="false"
						minHeight="120px"
						message="Save the group before configuring accounts"
					></app-page-message>
				</div>

				<div *ngIf="id && id != '0'">
					<!-- Desktop / wide: data-table -->
					<div class="ion-hide-lg-down">
						<app-data-table
							class="box-shadow"
							[rows]="companyAccountRows"
							[trackBy]="'IDBranch'"
							[showSpinner]="accountsLoading"
							[showFilter]="false"
							[mobileFilter]="false"
							[isQueryLocalOnly]="true"
						>
							<datatable-column class="col-name" name="Company" property="CompanyName">
								<ng-template let-i="row" datatable-cell-template>
									<ng-container *ngFor="let w of i.levels; let k = index"><span class="spacing" *ngIf="k > 0"></span></ng-container>
									<ion-text color="primary" class="bold">{{ i.CompanyName }}</ion-text>
								</ng-template>
							</datatable-column>
							<datatable-column class="col-name" name="Transfers account" property="Account">
								<ng-template let-i="row" datatable-cell-template>
									<app-input-control
										[field]="{
											id: 'Account',
											type: 'ng-select',
											form: i._formGroup,
											dataSource: ChartOfAccount,
											bindLabel: 'Name',
											bindValue: 'Code',
											clearable: true,
											appendTo: '#item-group-detail-page',
											placeholder: 'Search account',
											treeConfig: { searchFnDefault: true, isTree: true, isCollapsed: true }
										}"
										(change)="saveCompanyAccount(i)"
									></app-input-control>
								</ng-template>
							</datatable-column>
							<datatable-column class="col-name" name="Inventory account" property="AccountInventory">
								<ng-template let-i="row" datatable-cell-template>
									<app-input-control
										[field]="{
											id: 'AccountInventory',
											type: 'ng-select',
											form: i._formGroup,
											dataSource: ChartOfAccount,
											bindLabel: 'Name',
											bindValue: 'Code',
											clearable: true,
											appendTo: '#item-group-detail-page',
											placeholder: 'Search account',
											treeConfig: { searchFnDefault: true, isTree: true, isCollapsed: true }
										}"
										(change)="saveCompanyAccount(i)"
									></app-input-control>
								</ng-template>
							</datatable-column>
							<datatable-column class="col-name" name="Cost of goods sold account" property="AccountCostOfGoodsSold">
								<ng-template let-i="row" datatable-cell-template>
									<app-input-control
										[field]="{
											id: 'AccountCostOfGoodsSold',
											type: 'ng-select',
											form: i._formGroup,
											dataSource: ChartOfAccount,
											bindLabel: 'Name',
											bindValue: 'Code',
											clearable: true,
											appendTo: '#item-group-detail-page',
											placeholder: 'Search account',
											treeConfig: { searchFnDefault: true, isTree: true, isCollapsed: true }
										}"
										(change)="saveCompanyAccount(i)"
									></app-input-control>
								</ng-template>
							</datatable-column>
							<datatable-column class="col-name" name="Price difference account" property="AccountPriceDifference">
								<ng-template let-i="row" datatable-cell-template>
									<app-input-control
										[field]="{
											id: 'AccountPriceDifference',
											type: 'ng-select',
											form: i._formGroup,
											dataSource: ChartOfAccount,
											bindLabel: 'Name',
											bindValue: 'Code',
											clearable: true,
											appendTo: '#item-group-detail-page',
											placeholder: 'Search account',
											treeConfig: { searchFnDefault: true, isTree: true, isCollapsed: true }
										}"
										(change)="saveCompanyAccount(i)"
									></app-input-control>
								</ng-template>
							</datatable-column>
						</app-data-table>
					</div>

					<!-- Mobile: accordion + form-control -->
					<div class="accounts-mobile ion-hide-lg-up" *ngIf="!accountsLoading">
						<app-page-message [itemsLength]="companyAccountRows.length" [showSpinner]="false" [showImg]="false" minHeight="120px"></app-page-message>
						<ion-accordion-group [multiple]="true" *ngIf="companyAccountRows.length">
							<ion-accordion *ngFor="let row of companyAccountRows" [value]="'' + row.IDBranch" toggleIcon="chevron-down-outline">
								<ion-item slot="header">
									<ion-label>
										<span class="bold">{{ row.CompanyName }}</span>
									</ion-label>
								</ion-item>
								<div class="accounts-mobile-content" slot="content">
									<form [formGroup]="row._formGroup">
										<app-form-control
											[field]="{
												id: 'Account',
												label: 'Transfers account',
												type: 'ng-select',
												form: row._formGroup,
												dataSource: ChartOfAccount,
												bindLabel: 'Name',
												bindValue: 'Code',
												clearable: true,
												appendTo: '#item-group-detail-page',
												placeholder: 'Search account',
												treeConfig: { searchFnDefault: true, isTree: true, isCollapsed: true }
											}"
											(change)="saveCompanyAccount(row)"
										></app-form-control>
										<app-form-control
											[field]="{
												id: 'AccountInventory',
												label: 'Inventory account',
												type: 'ng-select',
												form: row._formGroup,
												dataSource: ChartOfAccount,
												bindLabel: 'Name',
												bindValue: 'Code',
												clearable: true,
												appendTo: '#item-group-detail-page',
												placeholder: 'Search account',
												treeConfig: { searchFnDefault: true, isTree: true, isCollapsed: true }
											}"
											(change)="saveCompanyAccount(row)"
										></app-form-control>
										<app-form-control
											[field]="{
												id: 'AccountCostOfGoodsSold',
												label: 'Cost of goods sold account',
												type: 'ng-select',
												form: row._formGroup,
												dataSource: ChartOfAccount,
												bindLabel: 'Name',
												bindValue: 'Code',
												clearable: true,
												appendTo: '#item-group-detail-page',
												placeholder: 'Search account',
												treeConfig: { searchFnDefault: true, isTree: true, isCollapsed: true }
											}"
											(change)="saveCompanyAccount(row)"
										></app-form-control>
										<app-form-control
											[field]="{
												id: 'AccountPriceDifference',
												label: 'Price difference account',
												type: 'ng-select',
												form: row._formGroup,
												dataSource: ChartOfAccount,
												bindLabel: 'Name',
												bindValue: 'Code',
												clearable: true,
												appendTo: '#item-group-detail-page',
												placeholder: 'Search account',
												treeConfig: { searchFnDefault: true, isTree: true, isCollapsed: true }
											}"
											(change)="saveCompanyAccount(row)"
										></app-form-control>
									</form>
								</div>
							</ion-accordion>
						</ion-accordion-group>
					</div>
				</div>
			</div>

			<div class="ion-padding" *ngIf="segmentView == 's2'">
				<ion-grid fixed>
					<form [formGroup]="formGroup">
						<ion-row class="hr-group" *ngIf="item.Id">
							<ion-col size="12" size-sm="12" size-md="12" size-xl="3">
								<ion-list-header class="ion-no-padding">
									<ion-label color="primary">{{ 'Other information' | translate }}</ion-label>
								</ion-list-header>
							</ion-col>
							<ion-col size="12" size-sm size-xl="4">
								<app-form-control [field]="{ id: 'CreatedBy', type: 'text', label: 'Created by', form: formGroup }"></app-form-control>
								<app-form-control [field]="{ id: 'CreatedDate', type: 'span-datetime', label: 'Created date', form: formGroup }"></app-form-control>
								<app-form-control [field]="{ id: 'ModifiedBy', type: 'text', label: 'Last modified by', form: formGroup }"></app-form-control>
								<app-form-control [field]="{ id: 'ModifiedDate', type: 'span-datetime', label: 'Last modified date', form: formGroup }"></app-form-control>
							</ion-col>
							<ion-col size="12" size-sm size-xl="4">
								<app-form-control
									[field]="{ id: 'IDBranch', type: 'branch-breadcrumbs', label: 'Branch', form: formGroup, dataSource: env.branchList }"
								></app-form-control>
								<app-form-control [field]="{ id: 'Remark', type: 'textarea', label: 'Remark', form: formGroup }" (change)="saveChange()"></app-form-control>
							</ion-col>
						</ion-row>
					</form>
				</ion-grid>
			</div>
		</div>
	</div>

	<app-page-message [itemsLength]="item ? 1 : 0" [showSpinner]="pageConfig.showSpinner"></app-page-message>
</ion-content>
